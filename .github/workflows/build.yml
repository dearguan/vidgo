name: Build Vidgo (Tauri Windows)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 (Tauri NSIS)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download yt-dlp.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/resources/bin/win32-x64" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "src-tauri/resources/bin/win32-x64/yt-dlp.exe"

      - name: Download ffmpeg.exe
        shell: pwsh
        run: |
          $zip = "ffmpeg.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "ffmpeg-temp" -Force
          $dir = Get-ChildItem -Path "ffmpeg-temp" -Directory | Select-Object -First 1
          Copy-Item "$($dir.FullName)\bin\ffmpeg.exe" "src-tauri/resources/bin/win32-x64/ffmpeg.exe"
          Remove-Item -Recurse -Force "ffmpeg-temp", $zip

      - name: Verify bundled binaries
        shell: pwsh
        run: |
          $files = @("src-tauri/resources/bin/win32-x64/yt-dlp.exe", "src-tauri/resources/bin/win32-x64/ffmpeg.exe")
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "Missing binary: $f" }
            "{0} -> {1:N1} MB" -f $f, ((Get-Item $f).Length / 1MB)
          }

      - name: Install npm dependencies
        run: npm ci

      # 必须先构建前端：tauri::generate_context! 在编译期要求 frontendDist 存在
      - name: Build frontend
        run: npm run build

      - name: Lint — TypeScript 类型检查
        run: npm run typecheck

      - name: Lint — Rust clippy（警告即失败）
        run: |
          cargo clippy --version
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Tauri app (NSIS)
        run: npm run tauri build -- --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Vidgo-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # 生成 latest.json，供应用内“检查更新”使用（走 Release 下载地址，不受 API 频率限制）
      - name: Generate update manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $manifest = [ordered]@{
            version     = $version
            url         = "https://github.com/${{ github.repository }}/releases/download/$tag/$($exe.Name)"
            size        = $exe.Length
            sha256      = $hash
            notes       = "Windows x64 安装包，安装后可在应用内自动更新。"
            publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          }
          $manifest | ConvertTo-Json | Set-Content "src-tauri/target/release/bundle/nsis/latest.json" -Encoding utf8NoBOM

      # 打 tag 时自动发布到 Releases，公开免登录下载
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/latest.json
          name: Vidgo ${{ github.ref_name }}
          body: |
            Windows x64 安装包，双击安装即可。

            - 支持 YouTube / B站 / 抖音等 1000+ 平台
            - 可选画质、仅下载音频（MP3 / M4A）
            - 体积约 50MB

            > 首次启动若失败，请把 `%APPDATA%\Vidgo\crash.log` 内容反馈给开发者。
          draft: false
          prerelease: false
