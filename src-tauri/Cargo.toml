[package]
name = "vidgo"
version = "0.4.11"
edition = "2021"
description = "Vidgo - 视频下载器"
authors = ["Vidgo"]

[lib]
name = "vidgo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "tray-icon", "image-png", "webview-data-url", "devtools",
] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
regex = "1"
log = "0.4"
env_logger = "0.11"
arboard = "3"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "socks"] }
html-escape = "0.2"
sha2 = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
