<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data:; frame-src 'self' https: http:; connect-src 'self' ws://localhost:* http://localhost:*"
    />
    <title>Vidgo 内置浏览器</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fc; }
      .chrome {
        display: flex; align-items: center; gap: 8px; padding: 8px 12px;
        border-bottom: 1px solid #e5e8ef; background: #ffffff;
      }
      .chrome button {
        width: 32px; height: 32px; border-radius: 6px; border: 1px solid transparent;
        background: transparent; cursor: pointer; color: #5a6270; font-size: 16px;
      }
      .chrome button:hover { background: #f0f2f7; }
      .chrome .addr {
        flex: 1; display: flex; align-items: center; gap: 8px;
        padding: 0 10px; height: 34px; border-radius: 17px;
        background: #f0f2f7; border: 1px solid #e5e8ef;
      }
      .chrome input {
        flex: 1; border: none; background: transparent; outline: none;
        font-size: 13px; color: #171b24; font-family: inherit;
      }
      .chrome .hint {
        font-size: 11px; color: #8a93a3; white-space: nowrap; margin-left: 4px;
      }
      #browser {
        display: block; width: 100%;
        height: calc(100% - 50px); background: #ffffff; border: none;
      }
      .quicklinks {
        display: flex; gap: 4px; margin-left: 4px;
      }
      .quicklinks button {
        width: auto; padding: 0 10px; font-size: 12px;
        background: #f0f2f7; color: #5a6270; border: 1px solid #e5e8ef;
      }
    </style>
  </head>
  <body>
    <div class="chrome">
      <button id="back" title="后退">←</button>
      <button id="fwd" title="前进">→</button>
      <button id="reload" title="刷新">↻</button>
      <button id="home" title="回到登录指南">⌂</button>
      <div class="addr">
        <input id="url" type="text" placeholder="输入网址，例如 https://www.douyin.com" />
      </div>
      <div class="quicklinks">
        <button data-url="https://www.douyin.com">抖音</button>
        <button data-url="https://www.bilibili.com">B站</button>
        <button data-url="https://www.youtube.com">YouTube</button>
        <button data-url="https://www.kuaishou.com">快手</button>
      </div>
    </div>
    <webview id="browser" partition="persist:vidgo-browser" allowpopups allowfullscreen></webview>
    <script>
      const wv = document.getElementById('browser');
      const urlInput = document.getElementById('url');
      const home = 'about:blank';

      function loadUrl(u) {
        let url = u.trim();
        if (!url) return;
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        wv.loadURL(url);
      }

      urlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') loadUrl(urlInput.value);
      });
      document.getElementById('back').onclick = () => wv.canGoBack() && wv.goBack();
      document.getElementById('fwd').onclick = () => wv.canGoForward() && wv.goForward();
      document.getElementById('reload').onclick = () => wv.reload();
      document.getElementById('home').onclick = () => loadUrl('https://www.douyin.com');
      document.querySelectorAll('.quicklinks button').forEach((b) => {
        b.onclick = () => loadUrl(b.dataset.url);
      });

      wv.addEventListener('did-navigate', () => { urlInput.value = wv.getURL(); });
      wv.addEventListener('did-navigate-in-page', () => { urlInput.value = wv.getURL(); });

      // 默认打开抖音登录
      loadUrl('https://www.douyin.com');
    </script>
  </body>
</html>
